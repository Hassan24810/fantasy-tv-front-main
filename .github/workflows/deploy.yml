name: Deploy to GitHub Pages

on:
  push:
    branches: [main_branch]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --mode production
        env:
          VITE_SUPABASE_URL: "https://txeirnqjstrtkbmcxomu.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4ZWlybnFqc3RydGtibWN4b211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MjExMzgsImV4cCI6MjA5MTk5NzEzOH0.BulZimGO9bMvFek1CoE0nQ5vfzwY5GMs3EoalxV615U"
          VITE_SUPABASE_PROJECT_ID: "gdmtitudnwtkekrejnzg"

      - name: Verify dist
        run: ls -la dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment